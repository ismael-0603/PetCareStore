spring.application.name=PetCareStore
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
petcare.imagenes.directorio=${PETCARE_UPLOAD_DIR:./uploads}
server.servlet.session.timeout=30m
