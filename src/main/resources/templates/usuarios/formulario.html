<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragmentos/layout :: cabeza('PetCare Store')}">
  </head>
  <body>
    <div th:replace="~{fragmentos/layout :: menu}">
    </div>
    <main class="container-fluid contenido">
      <div th:replace="~{fragmentos/layout :: mensajes}">
      </div>
      <div class="cabecera-pagina">
        <div>
          <p class="eyebrow">
            PETCARE STORE
          </p>
          <h1 th:text="${usuario.id == null ? 'Registrar usuario' : 'Editar usuario'}">
          </h1>
        </div>
      </div>
      <section class="panel formulario-panel">
        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
          <input type="hidden" th:field="*{id}">
          <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
            <p class="mb-1">
              Revisa los datos del formulario:
            </p>
            <ul class="mb-0">
              <li th:each="err : ${#fields.allErrors()}" th:text="${err}">
              </li>
            </ul>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="nombre">
                Nombre *
              </label>
              <input id="nombre" th:field="*{nombre}" type="text" class="form-control" th:errorclass="is-invalid" required maxlength="100">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="correo">
                Correo *
              </label>
              <input id="correo" th:field="*{correo}" type="email" class="form-control" th:errorclass="is-invalid" required maxlength="150">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="nuevaPassword">
                Contraseña nueva
              </label>
              <input id="nuevaPassword" name="nuevaPassword" type="password" class="form-control" autocomplete="new-password" minlength="8">
              <div class="form-text">
                Obligatoria al registrar; déjala vacía al editar para conservarla. Mínimo 8 caracteres.
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="rol">
                Rol *
              </label>
              <select id="rol" th:field="*{rol}" class="form-select" required>
                <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}">
                </option>
              </select>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input id="estado" type="checkbox" th:field="*{estado}" class="form-check-input">
                <label for="estado" class="form-check-label">
                  Activo
                </label>
              </div>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary">
              Guardar
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/usuarios}">
              Cancelar
            </a>
          </div>
        </form>
      </section>
    </main>
    <div th:replace="~{fragmentos/layout :: pie}">
    </div>
  </body>
</html>
