<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragmentos/layout :: cabeza('Usuarios · PetCare Store')}">
  </head>
  <body>
    <div th:replace="~{fragmentos/layout :: menu}">
    </div>
    <main class="container-fluid contenido">
      <div th:replace="~{fragmentos/layout :: mensajes}">
      </div>
      <div class="cabecera-pagina">
        <div>
          <p class="eyebrow">EQUIPO PETCARE</p>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <h1>Usuarios</h1>
            <span class="conteo-pildora" th:text="${#lists.size(registros) + (#lists.size(registros) == 1 ? ' usuario' : ' usuarios')}">0</span>
          </div>
        </div>
        <a class="btn btn-primary" sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/usuarios/nuevo}">
          + Registrar usuario
        </a>
      </div>

      <section class="panel-datos p-0 overflow-hidden d-none d-md-block">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${registros}">
                <td>
                  <div class="fw-bold" th:text="${r.nombre}"></div>
                  <div class="small text-secondary tabular" th:text="${'ID #' + r.id}"></div>
                </td>
                <td th:text="${r.correo}"></td>
                <td>
                  <span class="badge pildora-categoria" th:text="${r.rol}"></span>
                </td>
                <td>
                  <span class="badge" th:classappend="${r.estado ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${r.estado ? 'Activo' : 'Inactivo'}"></span>
                </td>
                <td class="text-end">
                  <a class="btn btn-sm btn-outline-primary" sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/usuarios/editar/{id}(id=${r.id})}">Editar</a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="5" class="text-center py-5 text-secondary">No se encontraron registros.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="d-md-none d-flex flex-column gap-3">
        <article class="lista-movil-card" th:each="r : ${registros}">
          <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
            <h2 class="h6 fw-bold mb-0" th:text="${r.nombre}"></h2>
            <span class="badge" th:classappend="${r.estado ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${r.estado ? 'Activo' : 'Inactivo'}"></span>
          </div>
          <div class="small text-secondary mb-2" th:text="${r.correo}"></div>
          <div class="d-flex justify-content-between align-items-center pt-2 border-top">
            <span class="badge pildora-categoria" th:text="${r.rol}"></span>
            <a class="btn btn-sm btn-outline-primary" sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/usuarios/editar/{id}(id=${r.id})}">Editar</a>
          </div>
        </article>
        <div th:if="${#lists.isEmpty(registros)}" class="panel-datos text-center py-5 text-secondary">No se encontraron registros.</div>
      </section>
    </main>
    <div th:replace="~{fragmentos/layout :: pie}">
    </div>
  </body>
</html>
