<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragmentos/layout :: cabeza('PetCare Store')}">
  </head>
  <body>
    <div th:replace="~{fragmentos/layout :: menu}">
    </div>
    <main class="container-fluid contenido">
      <div th:replace="~{fragmentos/layout :: mensajes}">
      </div>
      <div class="cabecera-pagina">
        <div>
          <p class="eyebrow">
            CATÁLOGO &amp; BIENESTAR
          </p>
          <h1>
            Productos
          </h1>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <!-- Reportes: exportan lo que muestra la lista, con los filtros activos -->
          <a class="btn btn-success" th:href="@{/productos/exportar/excel(nombre=${nombre},categoria=${categoriaFiltro},disponible=${disponible},minimo=${minimo},maximo=${maximo})}">
            Exportar a Excel
          </a>
          <a class="btn btn-danger" th:href="@{/productos/exportar/pdf(nombre=${nombre},categoria=${categoriaFiltro},disponible=${disponible},minimo=${minimo},maximo=${maximo})}">
            Exportar a PDF
          </a>
          <!-- Abre el modal de registro; /productos/nuevo sigue disponible como respaldo -->
          <button type="button" class="btn btn-primary" sec:authorize="hasRole('ADMINISTRADOR')" data-bs-toggle="modal" data-bs-target="#modalProducto">
            + Registrar producto
          </button>
        </div>
      </div>
      <form th:action="@{/productos}" method="get" class="panel row g-3 mb-4 filtros">
        <div class="col-md-4">
          <label for="buscar" class="form-label">
            Buscar por nombre
          </label>
          <input id="buscar" name="nombre" th:value="${nombre}" class="form-control" placeholder="Ej. collar, alimento...">
        </div>
        <div class="col-md-4">
          <label for="categoria" class="form-label">
            Categoría
          </label>
          <select id="categoria" name="categoria" class="form-select">
            <option value="">
              Todas
            </option>
            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${c.id == categoriaFiltro}">
            </option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="disponible" class="form-label">
            Disponibilidad
          </label>
          <select id="disponible" name="disponible" class="form-select">
            <option value="">
              Todas
            </option>
            <option value="true" th:selected="${disponible != null and disponible}">
              Con stock
            </option>
            <option value="false" th:selected="${disponible != null and !disponible}">
              Sin stock
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="minimo" class="form-label">
            Precio mínimo (S/)
          </label>
          <input id="minimo" name="minimo" type="number" min="0" step="0.01" th:value="${minimo}" class="form-control" placeholder="0.00">
        </div>
        <div class="col-md-3">
          <label for="maximo" class="form-label">
            Precio máximo (S/)
          </label>
          <input id="maximo" name="maximo" type="number" min="0" step="0.01" th:value="${maximo}" class="form-control" placeholder="0.00">
        </div>
        <div class="col-md-6 d-flex align-items-end gap-2">
          <button class="btn btn-primary">
            Aplicar filtros
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/productos}">
            Limpiar
          </a>
        </div>
      </form>
      <section class="panel p-0 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>
                  ID
                </th>
                <th>
                  Imagen
                </th>
                <th>
                  Nombre
                </th>
                <th>
                  Categoría
                </th>
                <th>
                  Precio
                </th>
                <th>
                  Stock
                </th>
                <th>
                  Estado
                </th>
                <th>
                  Acciones
                </th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${registros}">
                <td th:text="${r.id}">
                </td>
                <td>
                  <img class="producto-miniatura" th:src="${r.imagen != null ? '/imagenes/' + r.imagen : '/img/producto.svg'}" th:alt="${r.nombre}">
                </td>
                <td class="fw-semibold" th:text="${r.nombre}">
                </td>
                <td th:text="${r.categoria.nombre}">
                </td>
                <td class="text-nowrap fw-semibold" th:text="${'S/ ' + #numbers.formatDecimal(r.precio,1,2)}">
                </td>
                <td th:text="${r.stock}">
                </td>
                <td>
                  <span class="badge" th:classappend="${r.estado ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${r.estado ? 'Activo' : 'Inactivo'}">
                  </span>
                </td>
                <td>
                  <div class="d-flex gap-2 flex-wrap">
                    <a class="btn btn-sm btn-outline-primary" sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/productos/editar/{id}(id=${r.id})}">
                      Editar
                    </a>
                    <form sec:authorize="hasRole('ADMINISTRADOR')" th:action="@{/productos/eliminar/{id}(id=${r.id})}" method="post" data-confirmar="¿Deseas eliminar este registro? Esta acción no se puede deshacer.">
                      <button class="btn btn-sm btn-outline-danger">
                        Eliminar
                      </button>
                    </form>
                    <span class="text-secondary small" sec:authorize="hasRole('EMPLEADO')">
                      Solo consulta
                    </span>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="12" class="text-center py-5 text-secondary">
                  No se encontraron registros.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <!-- Paginación: conserva los filtros activos en cada enlace -->
      <nav th:if="${totalPaginas > 1}" aria-label="Paginación de productos" class="mt-3">
        <ul class="pagination flex-wrap mb-1">
          <li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/productos(pagina=${paginaActual - 1},nombre=${nombre},categoria=${categoriaFiltro},disponible=${disponible},minimo=${minimo},maximo=${maximo})}">
              Anterior
            </a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}" th:classappend="${i == paginaActual} ? 'active'">
            <a class="page-link" th:href="@{/productos(pagina=${i},nombre=${nombre},categoria=${categoriaFiltro},disponible=${disponible},minimo=${minimo},maximo=${maximo})}" th:text="${i + 1}">
            </a>
          </li>
          <li class="page-item" th:classappend="${paginaActual >= totalPaginas - 1} ? 'disabled'">
            <a class="page-link" th:href="@{/productos(pagina=${paginaActual + 1},nombre=${nombre},categoria=${categoriaFiltro},disponible=${disponible},minimo=${minimo},maximo=${maximo})}">
              Siguiente
            </a>
          </li>
        </ul>
        <p class="small text-secondary" th:text="${totalRegistros + ' productos en total'}">
        </p>
      </nav>
    </main>
    <!-- Modal de registro (solo administrador; el servidor lo vuelve a comprobar) -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoTitulo" aria-hidden="true" sec:authorize="hasRole('ADMINISTRADOR')">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <form class="modal-content" th:action="@{/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data">
          <div class="modal-header">
            <h2 class="modal-title h5" id="modalProductoTitulo">
              Registrar nuevo producto
            </h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="m-nombre">
                  Nombre *
                </label>
                <input id="m-nombre" name="nombre" type="text" class="form-control" required maxlength="150">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="m-categoria">
                  Categoría *
                </label>
                <select id="m-categoria" name="categoria.id" class="form-select" required>
                  <option value="">
                    Selecciona una categoría
                  </option>
                  <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}">
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="m-precio">
                  Precio (S/) *
                </label>
                <input id="m-precio" name="precio" type="number" class="form-control" required min="0" step="0.01">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="m-stock">
                  Stock inicial *
                </label>
                <input id="m-stock" name="stock" type="number" class="form-control" required min="0" step="1" value="0">
              </div>
              <div class="col-12">
                <label class="form-label" for="m-descripcion">
                  Descripción
                </label>
                <textarea id="m-descripcion" name="descripcion" class="form-control" rows="2" maxlength="1000"></textarea>
              </div>
              <div class="col-md-8">
                <label class="form-label" for="archivo">
                  Imagen del producto
                </label>
                <input id="archivo" name="archivo" type="file" accept="image/jpeg,image/png" class="form-control">
                <div class="form-text">
                  JPG o PNG, hasta 2 MB.
                </div>
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check form-switch">
                  <input id="m-estado" name="estado" type="checkbox" class="form-check-input" checked value="true">
                  <input type="hidden" name="_estado" value="on">
                  <label for="m-estado" class="form-check-label">
                    Activo
                  </label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">
              Guardar
            </button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
    <div th:replace="~{fragmentos/layout :: pie}">
    </div>
  </body>
</html>
