<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragmentos/layout :: cabeza('Categoría · PetCare Store')}">
  </head>
  <body>
    <div th:replace="~{fragmentos/layout :: menu}">
    </div>
    <main class="container-fluid contenido">
      <div th:replace="~{fragmentos/layout :: mensajes}">
      </div>
      <div class="cabecera-pagina">
        <div>
          <nav class="migas" aria-label="Ruta de navegación">
            <a th:href="@{/categorias}">Categorías</a>
            <span>/</span>
            <span th:text="${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'}"></span>
          </nav>
          <h1 th:text="${categoria.id == null ? 'Registrar categoría' : 'Editar categoría'}"></h1>
        </div>
      </div>

      <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
        <input type="hidden" th:field="*{id}">
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger mb-4 flex-column align-items-start" role="alert">
          <p class="mb-1 fw-bold">Revisa los datos del formulario:</p>
          <ul class="mb-0 ps-3">
            <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
          </ul>
        </div>
        <div class="row g-4">
          <div class="col-12 col-lg-8">
            <section class="panel-datos p-4">
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label" for="nombre">Nombre *</label>
                  <input id="nombre" th:field="*{nombre}" type="text" class="form-control" th:errorclass="is-invalid" required maxlength="100">
                </div>
                <div class="col-12">
                  <label class="form-label" for="descripcion">Descripción</label>
                  <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3" maxlength="500"></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check form-switch">
                    <input id="estado" type="checkbox" th:field="*{estado}" class="form-check-input">
                    <label for="estado" class="form-check-label fw-semibold">Categoría activa</label>
                  </div>
                </div>
              </div>
              <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/categorias}">Cancelar</a>
                <button class="btn btn-primary">Guardar categoría</button>
              </div>
            </section>
          </div>
          <div class="col-12 col-lg-4">
            <aside class="panel-datos p-4">
              <h2 class="h6 fw-bold mb-2">Reglas del catálogo</h2>
              <ul class="small text-secondary ps-3 mb-0 d-flex flex-column gap-2">
                <li>El nombre de cada categoría debe ser único en la tienda.</li>
                <li>Las categorías con productos asociados no pueden eliminarse hasta reasignar o retirar esos productos.</li>
              </ul>
            </aside>
          </div>
        </div>
      </form>
    </main>
    <div th:replace="~{fragmentos/layout :: pie}">
    </div>
  </body>
</html>
