<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragmentos/layout :: cabeza('Clientes · PetCare Store')}">
  </head>
  <body>
    <div th:replace="~{fragmentos/layout :: menu}">
    </div>
    <main class="container-fluid contenido">
      <div th:replace="~{fragmentos/layout :: mensajes}">
      </div>
      <div class="cabecera-pagina">
        <div>
          <p class="eyebrow">FAMILIAS &amp; TUTORES</p>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <h1>Clientes</h1>
            <span class="conteo-pildora" th:text="${#lists.size(registros) + (#lists.size(registros) == 1 ? ' cliente' : ' clientes')}">0</span>
          </div>
        </div>
        <a class="btn btn-primary" sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/clientes/nuevo}">
          + Registrar cliente
        </a>
      </div>

      <section class="panel-datos p-0 overflow-hidden d-none d-md-block">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Documento</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Dirección</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${registros}">
                <td>
                  <div class="fw-bold" th:text="${r.nombre + ' ' + r.apellido}"></div>
                  <div class="small text-secondary tabular" th:text="${'ID #' + r.id}"></div>
                </td>
                <td class="tabular" th:text="${r.documento}"></td>
                <td class="tabular text-nowrap" th:text="${r.telefono}"></td>
                <td th:text="${r.correo}"></td>
                <td class="text-secondary" th:text="${r.direccion}"></td>
                <td class="text-end">
                  <div class="d-inline-flex gap-2 flex-wrap justify-content-end">
                    <a class="btn btn-sm btn-outline-primary" sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/clientes/editar/{id}(id=${r.id})}">Editar</a>
                    <form sec:authorize="hasRole('ADMINISTRADOR')" th:action="@{/clientes/eliminar/{id}(id=${r.id})}" method="post" th:attr="data-confirmar=${'¿Deseas eliminar al cliente «' + r.nombre + ' ' + r.apellido + '»? Esta acción no se puede deshacer.'}">
                      <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="6" class="text-center py-5 text-secondary">No se encontraron registros.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="d-md-none d-flex flex-column gap-3">
        <article class="lista-movil-card" th:each="r : ${registros}">
          <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
            <h2 class="h6 fw-bold mb-0" th:text="${r.nombre + ' ' + r.apellido}"></h2>
            <span class="badge pildora-categoria tabular" th:text="${r.documento}"></span>
          </div>
          <div class="small text-secondary tabular" th:text="${r.telefono + ' · ' + r.correo}"></div>
          <div class="small text-secondary mt-1" th:text="${r.direccion}"></div>
          <div class="d-flex justify-content-end gap-2 mt-3 pt-2 border-top" sec:authorize="hasRole('ADMINISTRADOR')">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/editar/{id}(id=${r.id})}">Editar</a>
            <form th:action="@{/clientes/eliminar/{id}(id=${r.id})}" method="post" th:attr="data-confirmar=${'¿Deseas eliminar al cliente «' + r.nombre + ' ' + r.apellido + '»? Esta acción no se puede deshacer.'}">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </div>
        </article>
        <div th:if="${#lists.isEmpty(registros)}" class="panel-datos text-center py-5 text-secondary">No se encontraron registros.</div>
      </section>
    </main>
    <div th:replace="~{fragmentos/layout :: pie}">
    </div>
  </body>
</html>
