<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{fragmentos/layout :: cabeza('Cliente · PetCare Store')}">
  </head>
  <body>
    <div th:replace="~{fragmentos/layout :: menu}">
    </div>
    <main class="container-fluid contenido">
      <div th:replace="~{fragmentos/layout :: mensajes}">
      </div>
      <div class="cabecera-pagina">
        <div>
          <nav class="migas" aria-label="Ruta de navegación">
            <a th:href="@{/clientes}">Clientes</a>
            <span>/</span>
            <span th:text="${cliente.id == null ? 'Nuevo cliente' : 'Editar cliente'}"></span>
          </nav>
          <h1 th:text="${cliente.id == null ? 'Registrar cliente' : 'Editar cliente'}"></h1>
        </div>
      </div>

      <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{id}">
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger mb-4 flex-column align-items-start" role="alert">
          <p class="mb-1 fw-bold">Revisa los datos del formulario:</p>
          <ul class="mb-0 ps-3">
            <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
          </ul>
        </div>
        <div class="row g-4">
          <div class="col-12 col-lg-8">
            <section class="panel-datos p-4">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="nombre">Nombre *</label>
                  <input id="nombre" th:field="*{nombre}" type="text" class="form-control" th:errorclass="is-invalid" required maxlength="100">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="apellido">Apellido *</label>
                  <input id="apellido" th:field="*{apellido}" type="text" class="form-control" th:errorclass="is-invalid" required maxlength="100">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="documento">Documento *</label>
                  <input id="documento" th:field="*{documento}" type="text" class="form-control tabular" th:errorclass="is-invalid" required maxlength="20">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="telefono">Teléfono (9 dígitos) *</label>
                  <input id="telefono" th:field="*{telefono}" type="tel" class="form-control tabular" th:errorclass="is-invalid" required pattern="[0-9]{9}" maxlength="9" inputmode="numeric" title="Ingrese exactamente 9 dígitos">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="correo">Correo *</label>
                  <input id="correo" th:field="*{correo}" type="email" class="form-control" th:errorclass="is-invalid" required maxlength="150">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="direccion">Dirección *</label>
                  <input id="direccion" th:field="*{direccion}" type="text" class="form-control" th:errorclass="is-invalid" required maxlength="250">
                </div>
              </div>
              <div class="d-flex gap-2 justify-content-end mt-4 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
                <button class="btn btn-primary">Guardar cliente</button>
              </div>
            </section>
          </div>
          <div class="col-12 col-lg-4">
            <aside class="panel-datos p-4">
              <h2 class="h6 fw-bold mb-2">Validaciones de registro</h2>
              <ul class="small text-secondary ps-3 mb-0 d-flex flex-column gap-2">
                <li>El número de documento y el correo electrónico son únicos entre clientes.</li>
                <li>El teléfono debe contener exactamente 9 dígitos numéricos.</li>
              </ul>
            </aside>
          </div>
        </div>
      </form>
    </main>
    <div th:replace="~{fragmentos/layout :: pie}">
    </div>
  </body>
</html>
