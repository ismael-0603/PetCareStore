spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:petcare;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${TEST_DDL:create-drop}
spring.jpa.open-in-view=false
spring.sql.init.mode=never
petcare.imagenes.directorio=./target/test-uploads
